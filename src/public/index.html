<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>京程一灯Web3精英班 - 作业助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      height: 90vh;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .message {
      margin-bottom: 16px;
      display: flex;
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      word-wrap: break-word;
    }

    .message.user .message-content {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .message.assistant .message-content {
      background: white;
      color: #333;
      border: 1px solid #e0e0e0;
    }

    .message.assistant .message-content h2 {
      font-size: 16px;
      margin: 12px 0 8px 0;
      color: #667eea;
    }

    .message.assistant .message-content ul,
    .message.assistant .message-content ol {
      margin-left: 20px;
      margin-top: 8px;
    }

    .message.assistant .message-content li {
      margin: 4px 0;
    }

    .sources {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e0e0e0;
      font-size: 12px;
      color: #666;
    }

    .sources-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .source-item {
      margin: 2px 0;
      padding-left: 8px;
    }

    .input-container {
      display: flex;
      padding: 20px;
      background: white;
      border-top: 1px solid #e0e0e0;
      gap: 12px;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .day-filter {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .day-filter input {
      width: 80px;
      padding: 6px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      resize: none;
      font-family: inherit;
      outline: none;
    }

    textarea:focus {
      border-color: #667eea;
    }

    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: white;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      max-width: 70%;
    }

    .loading-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .welcome {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .welcome h2 {
      color: #667eea;
      margin-bottom: 16px;
    }

    .example-questions {
      margin-top: 20px;
      text-align: left;
    }

    .example-questions p {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .example-questions ul {
      list-style: none;
    }

    .example-questions li {
      padding: 8px 12px;
      margin: 8px 0;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .example-questions li:hover {
      transform: translateX(4px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📚 京程一灯Web3精英班</h1>
      <p>作业助手 - 让学习更轻松</p>
    </div>

    <div class="chat-container" id="chatContainer">
      <div class="welcome">
        <h2>欢迎使用作业助手！</h2>
        <p>我可以帮助你理解作业要求、梳理开发流程、提供注意事项</p>
        <div class="example-questions">
          <p>试试这些问题：</p>
          <ul>
            <li onclick="askQuestion('帮我梳理第一周周六的作业项目开发流程和注意点')">📝 帮我梳理第一周周六的作业项目开发流程和注意点</li>
            <li onclick="askQuestion('智能合约开发有哪些注意事项？')">🔒 智能合约开发有哪些注意事项？</li>
            <li onclick="askQuestion('如何部署智能合约到测试网？')">🚀 如何部署智能合约到测试网？</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="input-container">
      <div class="input-wrapper">
        <div class="day-filter">
          <label>
            <input type="checkbox" id="useDayFilter" onchange="toggleDayFilter()">
            筛选第
          </label>
          <input type="number" id="dayInput" placeholder="1" min="1" disabled>
          <span>天的作业</span>
        </div>
        <textarea
          id="questionInput"
          rows="2"
          placeholder="输入你的问题，例如：帮我梳理第一周周六的作业项目开发流程..."
          onkeypress="handleKeyPress(event)"
        ></textarea>
      </div>
      <button onclick="sendMessage()" id="sendButton">发送</button>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let isLoading = false;

    function toggleDayFilter() {
      const checkbox = document.getElementById('useDayFilter');
      const input = document.getElementById('dayInput');
      input.disabled = !checkbox.checked;
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function askQuestion(question) {
      document.getElementById('questionInput').value = question;
      sendMessage();
    }

    async function sendMessage() {
      if (isLoading) return;

      const input = document.getElementById('questionInput');
      const question = input.value.trim();

      if (!question) return;

      const useDayFilter = document.getElementById('useDayFilter').checked;
      const dayInput = document.getElementById('dayInput');
      const day = useDayFilter ? parseInt(dayInput.value) || undefined : undefined;

      // 清空输入
      input.value = '';

      // 添加用户消息
      addMessage('user', question);

      // 显示加载状态
      const loadingId = showLoading();
      isLoading = true;
      updateSendButton(true);

      try {
        const response = await fetch(`${API_BASE}/api/chat`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ question, day }),
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();

        // 移除加载状态
        removeLoading(loadingId);

        // 添加助手回复
        addMessage('assistant', data.answer, data.sources);

      } catch (error) {
        console.error('Error:', error);
        removeLoading(loadingId);
        addMessage('assistant', '抱歉，发生了错误：' + error.message);
      } finally {
        isLoading = false;
        updateSendButton(false);
      }
    }

    function addMessage(role, content, sources = []) {
      const container = document.getElementById('chatContainer');

      // 移除欢迎消息
      const welcome = container.querySelector('.welcome');
      if (welcome) {
        welcome.remove();
      }

      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';

      // 处理Markdown格式
      let html = content
        .replace(/#{2}\s+(.+)/g, '<h2>$1</h2>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n/g, '<br>');

      contentDiv.innerHTML = html;

      // 添加引用来源
      if (sources && sources.length > 0) {
        const sourcesDiv = document.createElement('div');
        sourcesDiv.className = 'sources';
        sourcesDiv.innerHTML = '<div class="sources-title">📚 引用来源：</div>';
        sources.forEach(source => {
          const sourceItem = document.createElement('div');
          sourceItem.className = 'source-item';
          sourceItem.textContent = source;
          sourcesDiv.appendChild(sourceItem);
        });
        contentDiv.appendChild(sourcesDiv);
      }

      messageDiv.appendChild(contentDiv);
      container.appendChild(messageDiv);

      // 滚动到底部
      container.scrollTop = container.scrollHeight;
    }

    function showLoading() {
      const container = document.getElementById('chatContainer');
      const loadingDiv = document.createElement('div');
      const loadingId = 'loading-' + Date.now();
      loadingDiv.id = loadingId;
      loadingDiv.className = 'message assistant';
      loadingDiv.innerHTML = `
        <div class="loading">
          <div class="loading-spinner"></div>
          <span>思考中...</span>
        </div>
      `;
      container.appendChild(loadingDiv);
      container.scrollTop = container.scrollHeight;
      return loadingId;
    }

    function removeLoading(loadingId) {
      const loadingDiv = document.getElementById(loadingId);
      if (loadingDiv) {
        loadingDiv.remove();
      }
    }

    function updateSendButton(disabled) {
      const button = document.getElementById('sendButton');
      button.disabled = disabled;
      button.textContent = disabled ? '发送中...' : '发送';
    }
  </script>
</body>
</html>
